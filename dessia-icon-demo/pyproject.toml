[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dessia_icon_demo"
version = "0.2.0"
description = "Dessia Git distribution icon discovery demo"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["dessia_icon_demo*"]
